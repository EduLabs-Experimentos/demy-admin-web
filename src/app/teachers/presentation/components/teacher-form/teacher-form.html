<div class="form-card">
  <h3 class="form-title">{{ 'teachers.form.title' | translate }}</h3>

  <div class="form-field">
    <label for="firstName">{{ 'teachers.form.firstName' | translate }}</label>
    <input pInputText id="firstName" type="text"
           [value]="store.formData().firstName"
           (input)="store.onFieldChange('firstName', $any($event.target).value)"
           [placeholder]="'teachers.form.firstName-placeholder' | translate"
           class="form-input" autocomplete="given-name" />
  </div>

  <div class="form-field">
    <label for="lastName">{{ 'teachers.form.lastName' | translate }}</label>
    <input pInputText id="lastName" type="text"
           [value]="store.formData().lastName"
           (input)="store.onFieldChange('lastName', $any($event.target).value)"
           [placeholder]="'teachers.form.lastName-placeholder' | translate"
           class="form-input" autocomplete="family-name" />
  </div>

  <div class="form-field">
    <label for="emailAddress">{{ 'teachers.form.email' | translate }}</label>
    <input pInputText id="emailAddress" type="email"
           [value]="store.formData().emailAddress"
           (input)="store.onFieldChange('emailAddress', $any($event.target).value)"
           [placeholder]="'teachers.form.email-placeholder' | translate"
           class="form-input" autocomplete="email" />
  </div>

  <div class="form-row">
    <div class="form-field form-field-small">
      <label for="countryCode">{{ 'teachers.form.countryCode' | translate }}</label>
      <input pInputText id="countryCode" type="text"
             [value]="store.formData().countryCode"
             (input)="store.onFieldChange('countryCode', $any($event.target).value)"
             class="form-input" />
    </div>
    <div class="form-field form-field-flex">
      <label for="phone">{{ 'teachers.form.phone' | translate }}</label>
      <input pInputText id="phone" type="tel"
             [value]="store.formData().phone"
             (input)="store.onFieldChange('phone', $any($event.target).value)"
             [placeholder]="'teachers.form.phone-placeholder' | translate"
             class="form-input" autocomplete="tel" />
    </div>
  </div>

  <p-button [label]="'teachers.form.register' | translate"
            styleClass="submit-button"
            [loading]="store.isLoading()"
            [rounded]="true"
            (onClick)="register()" />
</div>
