<form [formGroup]="form" (ngSubmit)="performSignIn()" class="signin-form" animate.enter="enter-animation">
  @if (store.signInError(); as error) {
    <div class="form-error-banner">
      <i class="pi pi-exclamation-triangle"></i>
      <span>{{ error }}</span>
    </div>
  }

  <div class="form-field">
    <label for="email">{{ 'sign-in.email' | translate }}</label>
    <span class="p-input-icon-left w-full">
      <input pInputText
             id="email"
             type="email"
             formControlName="email"
             [class.ng-invalid]="isInvalidControl(form, 'email')"
             placeholder="{{ 'sign-in.email-placeholder' | translate }}"
             class="form-input"
             autocomplete="email" />
    </span>
    @if (isInvalidControl(form, 'email')) {
      <small class="p-error">{{ errorMessagesForControl(form, 'email') }}</small>
    }
  </div>

  <div class="form-field">
    <label for="password">{{ 'sign-in.password' | translate }}</label>
    <p-password inputId="password"
                formControlName="password"
                [toggleMask]="true"
                [class.ng-invalid]="isInvalidControl(form, 'password')"
                placeholder="{{ 'sign-in.password-placeholder' | translate }}"
                styleClass="w-full"
                inputStyleClass="form-input"
                autocomplete="current-password"
                [feedback]="false">
      <i class="pi pi-lock"></i>
    </p-password>
    @if (isInvalidControl(form, 'password')) {
      <small class="p-error">{{ errorMessagesForControl(form, 'password') }}</small>
    }
  </div>

  <div class="forgot-password-row">
    <a routerLink="/reset-password" class="forgot-password-link">
      {{ 'sign-in.forgot-password' | translate }}
    </a>
  </div>

  <p-button type="submit"
            label="{{ 'sign-in.sign-in' | translate }}"
            styleClass="submit-button"
            [loading]="store.loadingUsers()"
            [rounded]="true">
    <i class="pi pi-sign-in"></i>
  </p-button>
</form>
