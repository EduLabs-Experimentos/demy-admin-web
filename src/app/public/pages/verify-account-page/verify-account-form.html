<form [formGroup]="form" (ngSubmit)="verify()" class="verify-form">
  @if (store.verifyError(); as error) {
    <div class="form-error-banner">
      <i class="pi pi-exclamation-triangle"></i>
      <span>{{ error }}</span>
    </div>
  }

  <div class="email-display">
    <span>{{ 'verify-account.code-sent-to' | translate }}</span>
    <strong>{{ emailValue }}</strong>
  </div>

  <div class="form-field">
    <label for="code">{{ 'verify-account.code' | translate }}</label>
    <input pInputText
           id="code"
           type="text"
           formControlName="code"
           maxlength="6"
           placeholder="{{ 'verify-account.code-placeholder' | translate }}"
           class="form-input code-input" />
  </div>

  <p-button type="submit"
            label="{{ 'verify-account.verify' | translate }}"
            styleClass="submit-button"
            [loading]="store.isLoadingUsers()"
            [rounded]="true" />

  <div class="resend-section">
    <span>{{ 'verify-account.didnt-receive' | translate }}</span>
    <button type="button"
            class="resend-btn"
            (click)="resendCode()"
            [disabled]="isResending">
      {{ isResending ? '...' : ('verify-account.resend-code' | translate) }}
    </button>
  </div>
</form>
