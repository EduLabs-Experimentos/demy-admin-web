<header class="enrollments-page__header">
  <div class="enrollments-page__header-text">
    <span class="enrollments-page__eyebrow">{{ 'sidebar.sections.administration' | translate }}</span>
    <h1 class="enrollments-page__title">{{ 'enrollments.page.title' | translate }}</h1>
    <p class="enrollments-page__subtitle">{{ 'enrollments.page.subtitle' | translate }}</p>
  </div>
</header>

<div class="enrollments-page__content">
  <aside class="enrollments-page__form-col">
    <app-enrollment-form />
  </aside>
  <section class="enrollments-page__list-col">
    <app-enrollment-list />
  </section>
</div>

<app-umux-survey-dialog
  [visible]="!!store.umuxSurveyContext()"
  [context]="store.umuxSurveyContext()"
  (submitted)="store.dismissUmuxSurvey()"
  (dismissed)="store.dismissUmuxSurvey()"
/>
