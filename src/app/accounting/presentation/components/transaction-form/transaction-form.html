<article class="transaction-form">
  <h3 class="transaction-form__title">{{ (store.isEditing() ? 'accounting.form.title-edit' : 'accounting.form.title-create') | translate }}</h3>

  <div class="transaction-form__field">
    <label class="transaction-form__label" for="tx-type">{{ 'accounting.form.type' | translate }}</label>
    <select id="tx-type" class="transaction-form__select"
            [value]="store.formData().transactionType"
            (change)="store.onFieldChange('transactionType', $any($event.target).value)">
      <option value="" disabled>{{ 'accounting.form.select-type' | translate }}</option>
      @for (t of store.transactionTypes; track t) { <option [value]="t">{{ 'accounting.type.' + t | translate }}</option> }
    </select>
  </div>

  <div class="transaction-form__field">
    <label class="transaction-form__label" for="tx-category">{{ 'accounting.form.category' | translate }}</label>
    <select id="tx-category" class="transaction-form__select"
            [value]="store.formData().transactionCategory"
            (change)="store.onFieldChange('transactionCategory', $any($event.target).value)">
      <option value="" disabled>{{ 'accounting.form.select-category' | translate }}</option>
      @for (c of store.transactionCategories; track c) { <option [value]="c">{{ 'accounting.category.' + c | translate }}</option> }
    </select>
  </div>

  <div class="transaction-form__field">
    <label class="transaction-form__label" for="tx-method">{{ 'accounting.form.method' | translate }}</label>
    <select id="tx-method" class="transaction-form__select"
            [value]="store.formData().transactionMethod"
            (change)="store.onFieldChange('transactionMethod', $any($event.target).value)">
      <option value="" disabled>{{ 'accounting.form.select-method' | translate }}</option>
      @for (m of store.transactionMethods; track m) { <option [value]="m">{{ 'accounting.method.' + m | translate }}</option> }
    </select>
  </div>

  <div class="transaction-form__row">
    <div class="transaction-form__field">
      <label class="transaction-form__label" for="tx-amount">{{ 'accounting.form.amount' | translate }}</label>
      <input pInputText id="tx-amount" type="number" step="0.01" class="transaction-form__input"
             [value]="store.formData().amount"
             (input)="store.onFieldChange('amount', $any($event.target).value)"
             [placeholder]="'accounting.form.amount-placeholder' | translate" />
    </div>
    <div class="transaction-form__field transaction-form__field--small">
      <label class="transaction-form__label" for="tx-currency">{{ 'accounting.form.currency' | translate }}</label>
      <select id="tx-currency" class="transaction-form__select"
              [value]="store.formData().currency"
              (change)="store.onFieldChange('currency', $any($event.target).value)">
        @for (c of store.currencies; track c) { <option [value]="c">{{ c }}</option> }
      </select>
    </div>
  </div>

  <div class="transaction-form__field">
    <label class="transaction-form__label" for="tx-description">{{ 'accounting.form.description' | translate }}</label>
    <input pInputText id="tx-description" type="text" class="transaction-form__input"
           [value]="store.formData().description"
           (input)="store.onFieldChange('description', $any($event.target).value)"
           [placeholder]="'accounting.form.description-placeholder' | translate" />
  </div>

  <div class="transaction-form__field">
    <label class="transaction-form__label" for="tx-date">{{ 'accounting.form.date' | translate }}</label>
    <input pInputText id="tx-date" type="date" class="transaction-form__input"
           [value]="store.formData().transactionDate"
           (input)="store.onFieldChange('transactionDate', $any($event.target).value)" />
  </div>

  <div class="transaction-form__actions">
    <p-button [label]="(store.isEditing() ? 'accounting.form.update' : 'accounting.form.create') | translate"
              styleClass="transaction-form__submit" [loading]="store.isLoading()" [rounded]="true" (onClick)="submit()" />
    @if (store.isEditing()) {
      <p-button [label]="'accounting.form.cancel' | translate" styleClass="transaction-form__cancel" [rounded]="true" severity="secondary" (onClick)="store.cancelEdit()" />
    }
  </div>

  @if (store.error(); as error) {
    <div class="transaction-form__error">
      <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
      <span>{{ error }}</span>
      <button class="transaction-form__error-dismiss" (click)="store.clearError()" aria-label="Dismiss"><i class="pi pi-times"></i></button>
    </div>
  }
</article>
